# WildBench: OpenEval's raw 1-10 judge channels → (x-1)/9; BenchPress
# (OpenCompass) single-answer WB-Score on -100..100 → s/180 + 4/9.
- {benchmark: wildbench, from_metric: score, to_metric: wb-score}
- {benchmark: wildbench, from_metric: score, to_metric: wb-score, source_config: openeval, scale_factor: 0.1111111111111111, scale_offset: -0.1111111111111111}
- {benchmark: wildbench, from_metric: score, to_metric: wb-score, source_config: benchpress,
   scale_factor: 0.005555555555555556, scale_offset: 0.4444444444444444,
   note: "OpenCompass single-answer WB-Score = (mean 1-10 rating - 5) x 20 on -100..100; wb-score = s/180 + 4/9. Evidence: BenchPress labels the number 'WildBench (Raw Score)' from OpenCompass (InternLM README: InternLM3-8B 33.1, Qwen2.5-7B 23.3, Llama3.1-8B 1.5, GPT-4o-mini 40.3, i.e. 1-10 ratings 6.7/6.2/5.1/7.0), and OpenCompass's single-answer summarizer emits exactly that scale (opencompass/summarizers/subjective/wildbench.py). The pairwise 'reward' variant shares the range but is not labelled 'score'; confidence medium — revisit if BenchPress documents the variant."}

