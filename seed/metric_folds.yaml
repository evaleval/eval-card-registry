# Per-benchmark metric naming folds (merged-benchmark-view spec, R2).
# An entry states: `from_metric` reported on `benchmark` IS the same
# measurement as `to_metric`, published under a generic name. Folds apply
# to every source reporting from_metric on that benchmark — so an entry is
# only valid when NO source uses that metric name for a different
# measurement on the same benchmark (that conflict is why hle needed a
# producer hotfix first, and why alpacaeval-2-0 / math / truthfulqa /
# scicode carry no score fold at all).
# NAMING FOLDS ONLY — protocol variants (cot-correct, exact-match under a
# different elicitation) never fold.
# Verified against warehouse snapshot 2026-08-13T22-02-24Z score ranges.

